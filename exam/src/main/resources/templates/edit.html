<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Coffee</title>

  <style>
    body{
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      background-color: lightgray;
      display: flex;
      flex-wrap: wrap;
      flex-direction: column;
      place-content: center;
      height:750px;
    }

    input{
      border-radius: 5px;
      height:40px;
    }

    div{
      padding: 10px;
    }

    a{
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      padding:10px;
      color: black;
      width:100px;
    }

    a:hover{
      background-color: black;
      color: white;
    }

    button{
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      padding:10px;
      color: white;
      background-color: black;
      border: none;
    }

    button:hover{
      background-color: white;
      color: black;
      cursor: pointer;
    }
  </style>

</head>
<body>
<h1 th:text="'Edit' + ${coffee.name}"></h1>
<div>
  <form th:action="@{/update}" method="post" th:object="${coffee}">
    <input type="hidden" name="id" th:value="*{id}">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" th:value="${coffee.name}" th:classappend="${#fields.hasErrors('name')} ? 'error' : '' "/>
      <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>
    <div>
      <label for="type">Type</label>
      <input type="text" id="type" th:value="${coffee.type}" th:classappend="${#fields.hasErrors('type')} ? 'error' : '' "/>
      <p class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
    </div>
    <div>
      <label>Size</label>
      <select th:field="*{size}" id="size">
        <option th:each="size : ${sizes}"
                th:value="${size}"
                th:text="${size}"
        ></option>
      </select>
    </div>
    <div>
      <input type="number" step="0.01" name="price" th:value="${coffee.price}" placeholder="Price" required />
    </div>
    <div>
      <label>Roast Level</label>
      <select th:field="*{roastLevel}" id="roastLevel">
        <option th:each="roastLevel : ${roastLevels}"
                th:value="${roastLevel}"
                th:text="${roastLevel}"
        ></option>
      </select>
    </div>
    <div>
      <input type="text" name="origin" th:value="${coffee.origin}" placeholder="Origin" required />
    </div>
    <div>
      <input type="checkbox" name="isDecaf" th:checked="${coffee.decaf}" value="true" /> Decaf
    </div>
    <div>
      <input type="number" name="stock" th:value="${coffee.stock}" placeholder="Stock" required />
    </div>
    <div>
      <input type="text" name="flavorNotes" th:value="${coffee.flavorNotes}" placeholder="Flavor Notes" required />
    </div>
    <div>
      <input type="text" name="brewMethod" th:value="${coffee.brewMethod}" placeholder="Brew Method" required />
    </div>
    <div class="action">
      <a th:href="@{/}" class="button cancel">Cancel</a>
      <button>Update Coffee</button>
    </div>
  </form>
</div>

<a href="/">Back to List</a>
</body>
</html>
