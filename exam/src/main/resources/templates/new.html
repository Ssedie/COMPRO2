<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Coffee</title>

  <style>
    body{
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      background-color: lightgray;
      display: flex;
      flex-wrap: wrap;
      flex-direction: column;
      place-content: center;
      height:750px;
    }

    input{
      border-radius: 5px;
      height:20px;
    }

    div{
      padding: 10px;
    }

    a{
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      padding:10px;
      color: black;
    }

    a:hover{
      background-color: black;
      color: white;
    }

    button{
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      padding:10px;
      color: white;
      background-color: black;
      border: none;
    }

    button:hover{
      background-color: white;
      color: black;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h1>New Coffee</h1>
<div>
  <form action="/save" method="POST" th:object="${newCoffee}">
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'error' : '' ">
      <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>
    <div>
      <label for="type">Type:</label>
      <select id="type" th:field="*{types}">
        <option th:each="type : ${types}"
                th:value="${type}"
                th:text="${type}"
        ></option>
      </select>
    </div>
    <div>
      <label for="size">Size:</label>
      <select id="size" th:field="*{sizes}">
        <option th:each="size : ${sizes}"
                th:value="${size}"
                th:text="${size}"
        ></option>
      </select>
    </div>
    <div>
      <label for="price">Price:</label>
      <input type="number" step="0.01" id="price" name="price" required>
    </div>
    <div>
      <label for="roastLevel">Roast Level:</label>
      <select id="roastLevel" th:field="*{roastLevels}">
        <option th:each="level : ${roastLevels}"
                th:value="${level}"
                th:text="${level}"
        ></option>
      </select>
    </div>
    <div>
      <label for="origin">Origin:</label>
      <input type="text" id="origin" name="origin">
    </div>
    <div>
      <label>Decaf:</label>
      <input type="hidden" name="isDecaf" value="false">
      <input type="checkbox" id="isDecaf" name="isDecaf" value="true">
    </div>
    <div>
      <label for="stock">Stock:</label>
      <input type="number" id="stock" name="stock">
    </div>
    <div>
      <label>Flavor Notes (comma-separated):</label>
      <input type="checkbox" name="flavorNotes" value="Chocolate">
      <input type="checkbox" name="flavorNotes" value="Mint">
      <input type="checkbox" name="flavorNotes" value="Strawberry">
      <input type="checkbox" name="flavorNotes" value="Orange">
      <input type="checkbox" name="flavorNotes" value="Blueberry">
      <input type="checkbox" name="flavorNotes" value="Pineapple">
    </div>
    <div>
      <label for="brewMethods">Brew Method:</label>
      <select id="brewMethods" th:field="*{brewMethods}">
        <option th:each="method : ${brewMethods}"
        th:value="${method}"
        th:text="${method}"
        ></option>>
      </select>
    </div>
    <button type="submit">Save</button>
  </form>
  <br>
  <a href="/">Back to List</a>
</div>
</body>
</html>
