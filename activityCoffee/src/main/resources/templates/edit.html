<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Coffee</title>
</head>
<body>
<h1>Edit Coffee</h1>
<form action="@{/update}" method="post">
  <input type="hidden" th:value="${coffee.id}" />
  <input type="text" th:value="${coffee.name}" placeholder="Name" required />
  <input type="text" th:value="${coffee.type}" placeholder="Type" required />
  <input type="text" th:value="${coffee.size}" placeholder="Size" required />
  <input type="number" step="0.01" th:value="${coffee.price}" placeholder="Price" required />
  <input type="text" th:value="${coffee.roastLevel}" placeholder="Roast Level" required />
  <input type="text" th:value="${coffee.origin}" placeholder="Origin" required />
  <input type="checkbox" th:value="${coffee.decaf}" /> Decaf
  <input type="number" th:value="${coffee.stock}" placeholder="Stock" required />
  <input type="text" th:value="${coffee.flavorNotes}" placeholder="Flavor Notes" required />
  <input type="text" th:value="${coffee.brewMethod}" placeholder="Brew Method" required />
  <button type="submit">Update Coffee</button>
</form>

<a href="/">Back to List</a>
</body>
</html>
